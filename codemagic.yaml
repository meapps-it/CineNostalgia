workflows:
  android-v1:
    name: CineNostalgia Android V1
    max_build_duration: 60
    environment:
      java: 17
      groups:
        - cinenostalgia_secrets
    scripts:
      - name: Test e APK debug
        script: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug
      - name: AAB release
        script: ./gradlew bundleRelease
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/bundle/release/*.aab
      - app/build/reports/tests/**/*.html
